[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pii-linter"
version = "0.1.0"
description = "Local pre-commit PII linter for VN datasets (CSV/JSONL/Markdown)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PII contributors" },
]
keywords = ["pii", "linter", "pre-commit", "vietnamese", "csv", "jsonl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/angWindy/vn-pii"
Repository = "https://github.com/angWindy/vn-pii"
Issues = "https://github.com/angWindy/vn-pii/issues"

[project.optional-dependencies]
dev = [
    "Faker>=30.0",
    "pytest>=8.0",
]
fixture = [
    "Faker>=30.0",
]

[project.scripts]
pii-lint = "pii_linter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pii_linter"]
include = ["pii_linter/hooks/templates/*.json", "pii_linter/hooks/templates/*.toml", "pii_linter/hooks/templates/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"