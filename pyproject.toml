[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pa1-pii-linter"
version = "0.1.0"
description = "Local pre-commit PII linter for VN datasets (CSV/JSONL/Markdown)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PA1 contributors" },
]
keywords = ["pii", "linter", "pre-commit", "vietnamese", "csv", "jsonl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "Faker>=30.0",
    "pandas>=2.0",
    "pytest>=8.0",
]
fixture = [
    "Faker>=30.0",
]

[project.scripts]
pa1-lint = "pii_linter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pii_linter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"