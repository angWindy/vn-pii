# PA1 suppressions
# Each entry marks values that LOOK like PII but are actually synthetic.
# Required fields: column_pattern (regex), value_prefix (literal),
# owner (who is responsible), expires_at (ISO date), reason.
#
# Best practice:
#   - Only suppress columns with synthetic prefixes (id_, dummy_, test_).
#   - Never suppress real customer data; remove from repo instead.
#   - Set a far-future expires_at but revisit every quarter.
suppressions:
  - column_pattern: customer_id
    value_prefix: "id_"
    owner: synth-data-team
    expires_at: 2027-12-31
    reason: Faker seed 42 generates synthetic IDs like id_0001..id_0050.

  - column_pattern: "(phone|email|contact)"
    value_prefix: "dummy_"
    owner: synth-data-team
    expires_at: 2027-12-31
    reason: Negative fixtures use dummy_<n> for phone/email/contact columns.

  - column_pattern: account_no
    value_prefix: "0"
    owner: finance-fixtures
    expires_at: 2027-12-31
    reason: Aggregated finance rollups show account_no="0" for null balances.