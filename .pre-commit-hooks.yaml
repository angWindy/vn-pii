- id: pii-lint-staged
  name: PII linter (staged diff)
  description: Scan only the lines staged in the current commit and block on HIGH+ PII.
# `language: python` + `python -m`, not the `pii-lint` console script.
# Two failure modes this avoids, both of which let a PII dataset commit
# clean because pre-commit only *warns* when a hook cannot start:
#   1. `language: system` runs `pii-lint` off PATH. Installed in a venv that
#      is not activated in the shell running `git commit`, it is simply not
#      there -> "Executable `pii-lint` not found" -> hook skipped.
#   2. `entry: python -m ...` needs a `python` on PATH, but Debian/Ubuntu
#      ships `python3` only.
# `language: python` has pre-commit build a dedicated env from this project's
# pyproject.toml, so the hook fires from any shell and needs no manual install.
entry: python -m pii_linter scan --staged
language: python
pass_filenames: false
stages: [pre-commit, manual]
# No `types_or` on purpose: identify has no `jsonl` tag, and naming one makes
# pre-commit refuse to load this config at all (every commit fails, even
# clean ones). `scan --staged` already filters added lines down to
# .csv/.jsonl/.md itself, so the hook self-filters per commit.