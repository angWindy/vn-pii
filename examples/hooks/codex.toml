# PA1 PII linter hook for OpenAI Codex CLI.
#
# Install:
#   1. Edit ~/.codex/config.toml (create if absent).
#   2. Add the lines below under [project] or at the top level.
#   3. Make sure `pa1-lint` is on PATH.
#
# Behavior:
#   notify runs every time Codex finishes a turn (success or fail).
#   The wrapper script scans `git diff HEAD` and exits 2 if HIGH+ PII was
#   just introduced. Codex reads the notify output back into the chat,
#   so the user sees the report and can ask Codex to fix it.

[project]
# ...your existing project settings...
notify = ["bash", "examples/hooks/codex-notify.sh"]